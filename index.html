<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secure Password Generator</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="background"></div>

<div class="container">

    <h1>🔐 Password Generator</h1>

    <p class="subtitle">
        Generate strong and secure passwords instantly.
    </p>

    <div class="password-box">

        <input
            type="text"
            id="password"
            readonly
            placeholder="Your password appears here">

        <button id="copyBtn">
            📋 Copy
        </button>

    </div>

    <div class="options">

        <div class="option">

            <label>
                Password Length
            </label>

            <span id="lengthValue">
                12
            </span>

        </div>

        <input
            type="range"
            id="length"
            min="4"
            max="32"
            value="12">

        <label class="checkbox">

            <input
                type="checkbox"
                id="uppercase"
                checked>

            Uppercase Letters

        </label>

        <label class="checkbox">

            <input
                type="checkbox"
                id="lowercase"
                checked>

            Lowercase Letters

        </label>

        <label class="checkbox">

            <input
                type="checkbox"
                id="numbers"
                checked>

            Numbers

        </label>

        <label class="checkbox">

            <input
                type="checkbox"
                id="symbols"
                checked>

            Symbols

        </label>

        <label class="checkbox">

            <input
                type="checkbox"
                id="similar">

            Exclude Similar Characters

        </label>

    </div>

    <div class="strength">

        <div class="strength-text">

            Password Strength

        </div>

        <div class="strength-bar">

            <div
                id="strengthFill">
            </div>

        </div>

        <span id="strengthLabel">
            Medium
        </span>

    </div>

    <button
        id="generateBtn"
        class="generate">

        Generate Password

    </button>

</div>

<script src="script.js"></script>

</body>

</html>
